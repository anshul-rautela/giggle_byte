<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="GiggleByte banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd866"/>
      <stop offset="1" stop-color="#f0a92c"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" rx="16" fill="url(#bg)"/>

  <!-- Microphone -->
  <rect x="88" y="62" width="44" height="86" rx="22" fill="url(#gold)"/>
  <line x1="88" y1="92" x2="132" y2="92" stroke="#b9791a" stroke-width="3"/>
  <line x1="88" y1="108" x2="132" y2="108" stroke="#b9791a" stroke-width="3"/>
  <line x1="88" y1="124" x2="132" y2="124" stroke="#b9791a" stroke-width="3"/>
  <path d="M68 120 A42 42 0 0 0 152 120" fill="none" stroke="#f0a92c" stroke-width="6" stroke-linecap="round"/>
  <line x1="110" y1="162" x2="110" y2="192" stroke="#f0a92c" stroke-width="6" stroke-linecap="round"/>
  <line x1="84" y1="196" x2="136" y2="196" stroke="#f0a92c" stroke-width="6" stroke-linecap="round"/>

  <!-- Title -->
  <text x="190" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#f0f6fc">GiggleByte</text>
  <text x="192" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e">A stand-up comedian in your terminal</text>

  <!-- Terminal window -->
  <rect x="580" y="52" width="280" height="156" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M580 62 a10 10 0 0 1 10 -10 h260 a10 10 0 0 1 10 10 v18 h-280 z" fill="#161b22"/>
  <circle cx="600" cy="66" r="5" fill="#ff5f56"/>
  <circle cx="618" cy="66" r="5" fill="#ffbd2e"/>
  <circle cx="636" cy="66" r="5" fill="#27c93f"/>
  <text x="598" y="112" font-family="Consolas, Menlo, monospace" font-size="14" fill="#7ee787">$ python3 giggle_byte.py</text>
  <text x="598" y="140" font-family="Consolas, Menlo, monospace" font-size="14" fill="#c9d1d9">You: tell me a joke</text>
  <text x="598" y="168" font-family="Consolas, Menlo, monospace" font-size="14" fill="#ffd866">GiggleByte: ready for it?</text>
  <rect x="598" y="178" width="9" height="16" fill="#c9d1d9"/>
</svg>
